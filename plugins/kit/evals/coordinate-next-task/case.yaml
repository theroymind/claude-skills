schema_version: "1.1"
name: coordinate-next-task
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Agent, Skill]
  prompt: |
    Pick up the next task from the task list. Nobody is around to answer questions, so make the simplest sound call on anything open and report it.
graders:
  - name: boxes-unchecked
    type: regex
    target: {source: file, path: tasks/todo.md}
    pattern: "- \\[ \\] `slugify\\(text, \\{ maxLength \\}\\)`"
  - name: delegated
    type: tool_used
    tool: Agent
    min: 1
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:coordinate"
  - name: outcome
    type: llm
    weight: 2
    focus: trace
    criteria: |
      Pass only if all of these hold:
      - Only Task 1 (maxLength) was implemented; nothing for Task 2 (separator) was added.
      - `src/slugify.js` gained a maxLength option that meets the three acceptance criteria, and tests covering them were added.
      - `node --test` was run and passed after the change.
      - The final message reports what was done, the decisions made, and anything the user should check, and asks for approval rather than claiming the task is checked off.
