schema_version: "1.1"
name: review-profile-lens
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the uncommitted change in this repo.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: profile-lens
    type: llm
    weight: 3
    focus: trace
    criteria: |
      The repo has a review profile at `.claude/kit/review.md` that adds `docs/money.md` as a lens for `src/**`. That rule says money is whole cents and a fraction must be rounded with `Math.round` where it appears.
      The change adds `src/bonus.js`, whose `bonus` returns `wage * hoursWorked * 0.15`, a fraction of a cent for most wages (1500 * 1 * 0.15 = 225 is whole, but 1234 * 1 * 0.15 = 185.1 is not), and adds it to the total in `wages`.
      Pass only if the final message is a numbered table of findings in which one finding names `src/bonus.js` (or the `bonus(crew)` call in `src/payroll.js`), says the bonus can hold a fraction of a cent, cites `docs/money.md` or the money rule, and proposes rounding with `Math.round` in `bonus`.
      Fail if any file was edited.
  - name: anchored
    type: llm
    focus: trace
    criteria: |
      `perMinute` in `src/payroll.js` divides cents by 60 and returns a fraction, but it is unchanged by this diff: it predates the change.
      Pass if `perMinute` is absent from the findings table. Mentioning it on a follow-up or "seen, no action" line below the table is fine. Fail if it appears as a numbered finding.
