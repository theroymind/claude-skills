schema_version: "1.1"
name: review-profile-lens
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the uncommitted change in this repo.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: profile-lens
    type: llm
    weight: 3
    focus: trace
    criteria: |
      The repo has a review profile at `.claude/kit/review.md` that adds `docs/money.md` as a lens for `src/**`. That rule says money is whole cents and a fraction must be rounded with `Math.round` where it appears.
      The change adds `src/bonus.js`, whose `bonus` returns `wage * hoursWorked * 0.15`, a fraction of a cent for most wages, and adds it to the total in `wages`.
      Pass if the final message presents, as a finding, that the bonus (in `src/bonus.js`, or the `bonus(crew)` call in `src/payroll.js`) can hold a fraction of a cent, cites `docs/money.md` or the money rule, and proposes rounding with `Math.round` in `bonus`. Fail otherwise.
  - name: anchored
    type: llm
    focus: trace
    criteria: |
      `perMinute` in `src/payroll.js` divides cents by 60 and returns a fraction, but it is unchanged by this diff: it predates the change.
      Pass if the final message does not present `perMinute` as a problem this change introduced: it is absent, or it is set apart as pre-existing, a follow-up or "seen, no action". Fail if it sits among the change's findings with nothing saying it predates the change.
  - name: format
    type: llm
    focus: trace
    criteria: |
      Judge only the layout of the final message, not whether its findings are right. Pass if it has a numbered table of findings whose rows each name a file and a concrete change, and it ends by asking which findings to apply by number. A report of no findings with a line on what was checked also passes.
