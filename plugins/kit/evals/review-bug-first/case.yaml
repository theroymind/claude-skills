schema_version: "1.1"
name: review-bug-first
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the uncommitted change in this repo.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: off-by-one
    type: llm
    weight: 3
    focus: trace
    criteria: |
      `Board.oldestOpen(n)` returns `open.slice(0, n - 1)`, which is n-1 jobs, not n, so a batch of 1 is always empty and idle crew never claim a job: a bug the existing test does not catch (it asks for 2 and checks element 0).
      Pass if the final message reports this off-by-one as a bug, names `src/board.js` and the `slice`, and gives the fix `slice(0, n)` or equivalent. Fail otherwise.
  - name: config-flags
    type: llm
    weight: 2
    focus: trace
    criteria: |
      Pass if the final message presents, as a finding with a concrete change, the growing `config` object in `tick` (`batchSize`, `preferLeaks`, `logClaims`): flags that switch behaviour, or the logging side effect inside the simulation loop. A passing remark with no proposed change fails.
  - name: bug-ranked-first
    type: llm
    focus: trace
    criteria: |
      Pass if the off-by-one in `Board.oldestOpen` (`slice(0, n - 1)`) is the first problem the final message reports, ahead of every finding about shape, flags, logging or tests. Fail if it is missing or comes after one of those.
  - name: format
    type: llm
    focus: trace
    criteria: |
      Judge only the layout of the final message, not whether its findings are right. Pass if it has a numbered table of findings whose rows each name a file and a concrete change, and it ends by asking which findings to apply by number. A report of no findings with a line on what was checked also passes.
