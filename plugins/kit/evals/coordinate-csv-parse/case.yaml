schema_version: "1.1"
name: coordinate-csv-parse
runs: 5
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Agent, Skill, SendMessage]
  prompt: |
    Pick up the next task from the task list. Nobody is around to answer questions, so make the simplest sound call on anything open and report it.
graders:
  - name: boxes-unchecked
    type: regex
    target: {source: file, path: tasks/todo.md}
    pattern: "- \\[ \\] A quoted field may contain commas"
  - name: delegated
    type: tool_used
    tool: Agent
    min: 1
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:coordinate"
  - name: outcome
    type: llm
    weight: 2
    focus: trace
    criteria: |
      Pass only if all of these hold:
      - Only Task 1 (parse) was implemented; no `stringify` was added.
      - `src/parse.js` was rewritten as a single-pass parser rather than split-based, and tests for the acceptance criteria were added.
      - `node --test` was run and passed after the change.
      - The final message reports what was done, the decisions made, and anything the user should check, and asks for approval rather than claiming the task is checked off.
