schema_version: "1.1"
name: review-scattered-state
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the uncommitted change in this repo.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: scattered-state
    type: llm
    weight: 3
    focus: trace
    criteria: |
      The change adds `src/cart/CartDrawer.jsx`, which repeats `CartPage`'s wiring of four cart hooks: `useCartItems`, then `useCartTotals(items)`, then `useCartDiscount(subtotal)`, then `useCartCheckout(items, total, code)`. Each hook takes the previous one's results. Because each component calls `useCartItems` itself, the drawer gets its own empty `useState` list and never sees the page's items, and the drawer's discount code is always empty.
      Pass only if the final message is a numbered table of findings in which one finding names the cart's state being split across these hooks and wired again in each component, and proposes one cart hook with a small interface or a cart store shared by both components (a context-provided store, zustand, or similar).
      Fail if that finding is absent, or if any file was edited.
  - name: shared-state-bug
    type: llm
    focus: trace
    criteria: |
      Pass if the final message says, as a bug, that `CartDrawer` calls `useCartItems` separately and so shows an empty cart (or a cart separate from the page's), with its own empty discount code. Fail otherwise.
