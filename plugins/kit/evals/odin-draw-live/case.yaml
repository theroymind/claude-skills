schema_version: "1.1"
name: odin-draw-live
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review client/draw.odin.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: findings-format
    type: llm
    focus: trace
    criteria: |
      Pass if the final message contains a numbered list of findings under a Findings heading, each with a file reference and a concrete change, and the message ends by asking which to apply by number (a short scope note before the list, and a "checked, no action" section after it, are fine). Fail only if findings are unnumbered, lack file references or changes, or the closing ask is missing. The findings themselves are judged by a human, not here.
  - name: latent-surface-slot
    type: llm
    weight: 2
    focus: trace
    criteria: |
      In `slot_bounds` (client/draw.odin, the `Surface_Slot` case around lines 529-538) every item on a surface is centred on its parent and `s.index` is never read; it only draws right because `SIDE_TABLE_SURFACE_SLOT_COUNT` is 1, while the sim already allows several surface slots. Pass if a finding names this (slot_bounds ignoring the surface slot index, or items on a surface all drawing at one spot) and proposes placing by index or asserting the count is 1. Fail otherwise.
  - name: non-drawing-code
    type: llm
    weight: 2
    focus: trace
    criteria: |
      Pass if a finding says draw.odin holds code other files depend on that isn't drawing (label tables used by input/availability/layout_tools, the top-bar counts, or the picking geometry input.odin uses) and proposes moving it out. Fail otherwise.
