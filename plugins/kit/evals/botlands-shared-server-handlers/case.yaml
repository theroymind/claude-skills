schema_version: "1.1"
name: botlands-shared-server-handlers
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the client-to-server message modules in shared/net/messages/client-to-server.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: dependency-direction
    type: llm
    weight: 3
    focus: trace
    criteria: |
      Ground truth: 13 message files under shared/net/messages/client-to-server `require("server.game.*")` at module load, so the shared/ layer, which the client also loads, depends on server code. The fix made afterwards moved the execute bodies into server/command-handlers/ modules and left the shared files holding only schema and command envelope.
      Pass if the final message presents, as a finding, that files under shared/ require server modules, so the dependency points the wrong way (shared → server), and proposes moving the server-side execute logic out of shared/ (into a server-owned handler, an injected handler, or a registry the server fills). Naming one of the files is enough, and the finding may sit at any rank. Fail if it is absent, or appears only as a 'seen, no action' aside.
  - name: format
    type: llm
    focus: trace
    criteria: |
      Judge only the layout of the final message, not whether its findings are right. Pass if it has a numbered table of findings whose rows each name a file and a concrete change, and it ends by asking which findings to apply by number. A report of no findings with a line on what was checked also passes.
