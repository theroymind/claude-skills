schema_version: "1.1"
name: review-clean-change
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the uncommitted change in this repo.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: precision
    type: llm
    weight: 3
    focus: trace
    criteria: |
      The change adds `Board.nextOpen()` and has `crew.tick` use it with `board.claim`, plus tests. Crew touches no Board internals, dependencies point crew → board as documented, and there is no per-item cost problem at this size.
      Pass if every finding in the final message describes something actually present in the code and says concretely what to change, or the message reports no findings with a line on what was checked. Real observations that are acceptable as findings include: `claim` not checking that the job is unclaimed, `complete` not clearing a crew member's `jobId`, `nextOpen` returning the live job object, and the crew test living in the board test file. Fail if a finding is fabricated (coupling to Board internals, a dependency direction problem, a performance problem in `tick` at this size), or if any file was edited.
