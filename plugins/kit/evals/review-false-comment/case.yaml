schema_version: "1.1"
name: review-false-comment
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review the uncommitted change in this repo.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: false-claim
    type: llm
    weight: 3
    focus: trace
    criteria: |
      The change adds `assignAll` to `src/crew.js` with the comment "Board.claim skips a job that is already claimed, so two crews can never hold the same job." That is false: `Board.claim` in `src/board.js` sets `claimedBy` whatever its current value. With more crews than jobs, `index % jobs.length` hands one job to two crews, and the second claim overwrites the first while both crews keep the `jobId`.
      Pass only if the final message is a numbered table of findings that includes the double assignment as a bug, and says the comment's claim about `Board.claim` is false, citing `Board.claim` overwriting `claimedBy`. The two may be one finding or two.
      Fail if the review accepts the comment as true, or if any file was edited.
