schema_version: "1.1"
name: botlands-collider-composition
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review how props and entities get their colliders: shared/components/collider.lua, shared/components/ground-collider.lua, shared/map/prop-collider-mask.lua, and the prop handling in shared/data/world-definition.lua.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: two-derivations
    type: llm
    weight: 3
    focus: trace
    criteria: |
      Ground truth: entity colliders take a hand-typed `config.radius or 16` unrelated to the sprite, while prop colliders are derived from the sprite's painted "collision" layer by prop-collider-mask.derive, built per prop type inside world-definition's build_prop_mask_lookup. So collision geometry has two sources of truth, and whether a prop blocks the grid is decided by the presence of a painted layer rather than by what the prop is composed of. The refactor made afterwards unified both on one derivation from the sprite's collision layer, made `collider()` in a prop's behaviors the gate for blocking, and split prop-collider-mask.derive into derive_tile_offsets / derive_feet_rect / derive_radius.
      Pass if the final message presents, as a finding with a concrete change, one of: (a) the two separate derivation paths for collision geometry (entity radius from config, prop offsets from the sprite layer), proposing one shared derivation; (b) blocking gated by a painted-layer convention rather than the prop's composition, proposing a collider component as the gate; or (c) the prop anchor rule (bottom-centre on a tile) defined twice, in prop-collider-mask.derive and in the terrain set's footprint.lua, proposing one owner both call. Fail if none is present.
  - name: shared-requires-client
    type: llm
    focus: trace
    criteria: |
      Pass if the final message presents, as a finding with a concrete change, that shared/data/world-definition's build_prop_mask_lookup requires client.lib.sprite-cache, so shared and server code depend on the client's rendering code, and proposes a graphics-free source for the collider layer. Fail otherwise.
  - name: format
    type: llm
    focus: trace
    criteria: |
      Judge only the layout of the final message, not whether its findings are right. Pass if it has a numbered table of findings whose rows each name a file and a concrete change, and it ends by asking which findings to apply by number. A report of no findings with a line on what was checked also passes.
