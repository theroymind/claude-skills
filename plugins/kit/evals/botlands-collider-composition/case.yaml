schema_version: "1.1"
name: botlands-collider-composition
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review how props and entities get their colliders: shared/components/collider.lua, shared/components/ground-collider.lua, shared/map/prop-collider-mask.lua, and the prop handling in shared/data/world-definition.lua.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: two-derivations
    type: llm
    weight: 3
    focus: trace
    criteria: |
      Ground truth: entity colliders take a hand-typed `config.radius or 16` unrelated to the sprite, while prop colliders are derived from the sprite's painted "collision" layer by prop-collider-mask.derive, built per prop type inside world-definition's build_prop_mask_lookup. So collision geometry has two sources of truth, and whether a prop blocks the grid is decided by the presence of a painted layer rather than by what the prop is composed of. The refactor made afterwards unified both on one derivation from the sprite's collision layer (a sprite-source component plus a cached sprite-collider module), made `collider()` in a prop's behaviors the gate for blocking, and split prop-collider-mask.derive into derive_tile_offsets / derive_feet_rect / derive_radius.
      Pass only if the final message is a numbered list of findings and includes, at any rank, a finding about the shape of the prop-collision pipeline with a concrete change, of one of these kinds: (a) the two separate derivation paths for collision geometry (entity radius from config vs prop offsets from the sprite layer), proposing one shared derivation; (b) blocking gated by a painted-layer convention rather than the prop's composition, proposing a collider component as the gate; (c) the prop anchor rule (bottom-centre on a tile) defined twice, once in prop-collider-mask.derive and once in the terrain set's footprint.lua, proposing one owner both call; or (d) shared/data/world-definition's build_prop_mask_lookup requiring client.lib.sprite-cache, so shared and server code depend on the client's rendering pipeline, proposing a graphics-free collider-layer source. Fail if none is present as a numbered finding, or if any file was edited.
  - name: no-fabrication
    type: llm
    focus: trace
    criteria: |
      Fail only on clear evidence of fabrication: a finding that cites a file or function the trace shows does not exist, or describes behaviour the file contents in the trace directly contradict. Line numbers off by a few lines, claims you cannot verify from the trace, and judgement calls about severity are not fabrication. When unsure, pass.
