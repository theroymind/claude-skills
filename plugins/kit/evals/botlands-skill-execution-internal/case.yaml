schema_version: "1.1"
name: botlands-skill-execution-internal
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Agent, Skill]
  prompt: |
    Review shared/systems/skill-execution/_internal.lua.
graders:
  - name: no-edits
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: fired
    type: tool_used
    tool: Skill
    input_match: "kit:review"
  - name: split-by-responsibility
    type: llm
    weight: 3
    focus: trace
    criteria: |
      Ground truth: _internal.lua (339 lines) mixes four responsibilities: completion validation (validate_completion), resource deduction (deduct_mp_and_set_cooldown, consume_shot_for_skill, shot-type helpers), damage calculation (calculate_skill_damage, deal_damage, the mutable M.rng table), and execution/orchestration (apply_spell_damage, apply_weapon_skill_damage, build_skill_event, log_skill). The refactor made afterwards split it into _validation, _resources, _damage-calc and _execution modules behind a facade.
      Pass if the final message presents, as a finding at any rank, that the module holds several distinct responsibilities, identifies at least three of the four groups above (by their functions or by a plain description such as validation, costs, damage maths, running the skill), and proposes moving groups into separate modules. A partial split, different module names, or a fifth group are fine. Fail if no finding proposes splitting the module by responsibility.
  - name: format
    type: llm
    focus: trace
    criteria: |
      Judge only the layout of the final message, not whether its findings are right. Pass if it has a numbered table of findings whose rows each name a file and a concrete change, and it ends by asking which findings to apply by number. A report of no findings with a line on what was checked also passes.
